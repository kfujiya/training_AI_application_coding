spring:
  application:
    name: quiz-arena-backend
  profiles:
    default: local
server:
  port: ${SERVER_PORT:8081}

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: db
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/quiz_arena_db}
    username: ${DB_USERNAME:quiz_arena_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
