<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三目並べ</title>
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <main class="game" aria-labelledby="page-title">
      <h1 id="page-title">3目並べ</h1>
      <p id="status" class="status" role="status" aria-live="polite">○ のターンです</p>
      <div id="board" class="board" role="grid" aria-label="3目並べの盤面"></div>
      <button id="restart" class="restart" type="button" hidden>最初から始める</button>
    </main>
    <script src="app.js"></script>
  </body>
</html>
