spring:
  application:
    name: task-manager

  datasource:
    url: jdbc:postgresql://localhost:5433/task_manager
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

slack:
  oauth:
    client-id: ${SLACK_CLIENT_ID:}
    client-secret: ${SLACK_CLIENT_SECRET:}
    redirect-uri: ${SLACK_REDIRECT_URI:}
    encryption-key: ${SLACK_TOKEN_ENCRYPTION_KEY:}
