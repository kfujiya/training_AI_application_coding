<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('ログイン')}"></head>
<body>
<main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-6 col-lg-5">
  <div class="text-center mb-4"><h1 class="h3 fw-bold text-primary">Task Manager</h1><p class="text-muted mb-0">タスクをシンプルに管理</p></div>
  <div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5">
    <h2 class="h4 mb-4">ログイン</h2>
    <div th:if="${param.error}" class="alert alert-danger" role="alert">メールアドレスまたはパスワードが正しくありません。</div>
    <div th:if="${param.logout}" class="alert alert-success" role="alert">ログアウトしました。</div>
    <div th:if="${param.registered}" class="alert alert-success" role="alert">登録が完了しました。ログインしてください。</div>
    <form th:action="@{/login}" method="post">
      <div class="mb-3"><label class="form-label required" for="email">メールアドレス</label><input class="form-control" id="email" type="email" name="email" autocomplete="email" required></div>
      <div class="mb-4"><label class="form-label required" for="password">パスワード</label><input class="form-control" id="password" type="password" name="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100" type="submit">ログイン</button>
    </form>
  </div></div>
  <p class="text-center mt-3"><span class="text-muted">アカウントをお持ちでない方は</span> <a th:href="@{/register}">ユーザー登録</a></p>
</div></div></main>
</body>
</html>
