<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${pageTitle} + ' | dolly closet'">dolly closet</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="page-shell">
	<section class="hero">
		<div><p class="eyebrow">PERSONAL COLLECTION / 01</p><h1>ドールアーカイブ</h1><p>プロフィールと、クローゼットにあるお洋服を整理します。</p></div>
		<a class="button button-primary" th:href="@{/dolls/new}">＋ ドールをお迎え</a>
	</section>
	<div th:replace="~{fragments :: messages}"></div>
	<section class="stat-row">
		<div class="stat-card"><span>ドール</span><strong th:text="${dollCount}">0</strong><span>人</span></div>
		<div class="stat-card"><span>お洋服</span><strong th:text="${clothes}">0</strong><span>着</span></div>
		<a class="stat-card stat-link" th:href="@{/clothes}"><span>クローゼットを見る</span><strong>→</strong></a>
	</section>
	<section class="section-heading"><div><p class="eyebrow">DOLL PROFILE</p><h2>ドールプロフィール</h2></div><a class="text-link" th:href="@{/dolls}">一覧を見る →</a></section>
	<div class="card-grid" th:if="${!#lists.isEmpty(dolls)}">
		<a class="doll-card" th:each="doll : ${dolls}" th:href="@{/dolls/{id}(id=${doll.id})}">
			<div class="doll-card-body"><p class="eyebrow">DOLL PROFILE</p><h3 th:text="${doll.name}">名前</h3>
				<p class="muted" th:text="${doll.maker != null ? doll.maker : 'メーカー未登録'}">メーカー</p>
				<div class="tag-row"><span class="tag" th:if="${doll.bodyName}" th:text="${doll.bodyName}">ボディ</span><span class="tag" th:if="${doll.bodySize}" th:text="${doll.bodySize}">サイズ</span></div>
				<span class="card-arrow">プロフィールを見る <b>→</b></span>
			</div>
		</a>
	</div>
	<div class="empty-state" th:if="${#lists.isEmpty(dolls)}"><h2>ドールはまだ登録されていません</h2><p>プロフィールを登録して、コレクションの記録をはじめましょう。</p><a class="button button-primary" th:href="@{/dolls/new}">最初のドールを登録</a></div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
