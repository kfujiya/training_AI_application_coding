<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('タグ管理')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container page-container py-4"><div class="row g-4">
  <div class="col-12 col-lg-5"><div class="page-header"><h1 class="h2 mb-1">タグ管理</h1><p class="text-muted mb-0">タスクを整理するタグを管理します。</p></div><div class="card border-0 shadow-sm"><div class="card-body p-4"><h2 class="h5 mb-3">タグを追加</h2><form th:action="@{/tags}" th:object="${tagForm}" method="post" novalidate><label class="form-label required" for="tagName">タグ名</label><div class="input-group"><input class="form-control" th:errorclass="is-invalid" id="tagName" th:field="*{name}" maxlength="50" required><button class="btn btn-primary" type="submit">追加</button></div><div class="invalid-feedback d-block" th:errors="*{name}"></div></form></div></div></div>
  <div class="col-12 col-lg-7"><div class="card border-0 shadow-sm"><div class="card-header bg-white py-3"><h2 class="h5 mb-0">登録済みタグ</h2></div><div th:if="${#lists.isEmpty(tags)}" class="card-body text-center text-muted py-5">タグはまだありません。</div><div th:unless="${#lists.isEmpty(tags)}" class="list-group list-group-flush"><div class="list-group-item d-flex justify-content-between align-items-center" th:each="tag : ${tags}"><span class="badge rounded-pill bg-info text-dark" th:text="${tag.name}"></span><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/tags/{id}/edit(id=${tag.tagId})}">編集</a><form th:action="@{/tags/{id}/delete(id=${tag.tagId})}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit">削除</button></form></div></div></div></div></div>
</div></main>
</body>
</html>
