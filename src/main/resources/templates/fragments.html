<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/tasks}">Task Manager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="メニュー"><span class="navbar-toggler-icon"></span></button>
    <div id="mainNav" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0"><li class="nav-item"><a class="nav-link" th:href="@{/tasks}">タスク</a></li><li class="nav-item"><a class="nav-link" th:href="@{/tags}">タグ管理</a></li><li class="nav-item"><a class="nav-link" th:href="@{/settings/slack}">Slack連携</a></li></ul>
      <span class="navbar-text text-white me-3" th:if="${currentUserDisplayName != null}" th:text="${currentUserDisplayName}"></span>
      <form th:action="@{/logout}" method="post" class="d-flex"><button class="btn btn-outline-light btn-sm" type="submit">ログアウト</button></form>
    </div>
  </div>
</nav>
</body>
</html>
