<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="site-header">
	<a class="brand-mark" th:href="@{/}"><span>dolly closet<small>ドールとお洋服の記録</small></span></a>
	<nav aria-label="メインナビゲーション">
		<a th:href="@{/}" th:attr="aria-current=${pageTitle == 'うちの子たち' or pageTitle == 'ドール一覧' or pageTitle == 'ドールプロフィール' ? 'page' : null}">ドール</a>
		<a th:href="@{/clothes}" th:attr="aria-current=${pageTitle == 'お洋服を探す' or pageTitle == '所持アイテム詳細' ? 'page' : null}">所持アイテム</a>
		<a th:href="@{/designs}" th:attr="aria-current=${pageTitle == '商品デザイン' or pageTitle == '商品デザイン詳細' ? 'page' : null}">デザイン</a>
		<a th:href="@{/sets}" th:attr="aria-current=${pageTitle == 'フルセット一覧' ? 'page' : null}">セット</a>
		<a th:href="@{/brands}" th:attr="aria-current=${pageTitle == 'ブランド・購入元' ? 'page' : null}">ブランド</a>
	</nav>
</header>
<div th:fragment="messages" class="messages">
	<p class="notice success" th:if="${successMessage}" th:text="${successMessage}"></p>
	<p class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
</div>
<footer th:fragment="footer" class="site-footer">大切な子と、お気に入りのお洋服の記録</footer>
</body>
</html>
