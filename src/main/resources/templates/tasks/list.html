<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('タスク一覧')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container page-container py-4">
  <div class="page-header d-flex flex-wrap gap-3 justify-content-between align-items-center"><div><h1 class="h2 mb-1">タスク一覧</h1><p class="text-muted mb-0">自分のタスクを管理しましょう。</p></div><a class="btn btn-primary" th:href="@{/tasks/new}">＋ タスクを登録</a></div>
  <div th:if="${param.notFound}" class="alert alert-warning" role="alert">指定されたタスクは見つかりません。</div>
  <div class="card border-0 shadow-sm mb-4"><div class="card-body">
    <form th:action="@{/tasks}" th:object="${filter}" method="get" class="row g-3 align-items-end">
      <div class="col-12 col-md-4"><label class="form-label" for="title">タイトル</label><input class="form-control" id="title" th:field="*{title}" placeholder="タイトルで検索"></div>
      <div class="col-6 col-md-2"><label class="form-label" for="status">ステータス</label><select class="form-select" id="status" th:field="*{status}"><option value="">すべて</option><option value="TODO">未着手</option><option value="IN_PROGRESS">進行中</option><option value="DONE">完了</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" for="priority">優先度</label><select class="form-select" id="priority" th:field="*{priority}"><option value="">すべて</option><option value="LOW">低</option><option value="MEDIUM">中</option><option value="HIGH">高</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" for="tagId">タグ</label><select class="form-select" id="tagId" th:field="*{tagId}"><option value="">すべて</option><option th:each="tag : ${tags}" th:value="${tag.tagId}" th:text="${tag.name}"></option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" for="dueDate">期限</label><input class="form-control" id="dueDate" type="date" th:field="*{dueDate}"></div>
      <div class="col-12 d-flex gap-2"><button class="btn btn-outline-primary" type="submit">絞り込む</button><a class="btn btn-outline-secondary" th:href="@{/tasks}">条件をクリア</a></div>
    </form>
  </div></div>
  <div th:if="${#lists.isEmpty(tasks)}" class="card border-0 shadow-sm"><div class="card-body text-center text-muted py-5"><div class="display-6 mb-2">✓</div><p class="mb-0">該当するタスクはありません。</p></div></div>
  <div th:unless="${#lists.isEmpty(tasks)}" class="row g-4">
    <div class="col-12 col-md-6 col-xl-4" th:each="item : ${tasks}"><div class="card task-card border-0 shadow-sm h-100"><div class="card-body d-flex flex-column">
      <div class="d-flex justify-content-between gap-2 mb-2"><h2 class="h5 card-title mb-0"><a class="text-decoration-none" th:href="@{/tasks/{id}(id=${item.taskId})}" th:text="${item.title}"></a></h2><span class="badge bg-secondary align-self-start" th:text="${item.status}"></span></div>
      <div class="small text-muted mb-3">優先度: <span class="badge bg-light text-dark border" th:text="${item.priority}"></span> <span class="ms-2">期限: <span th:text="${item.dueDate != null ? item.dueDate : '-'}"></span></span></div>
      <div class="mb-3"><span class="badge rounded-pill bg-info text-dark tag-badge" th:each="tagName : ${item.tagNames}" th:text="${tagName}"></span><span th:if="${#lists.isEmpty(item.tagNames)}" class="text-muted small">タグなし</span></div>
      <div class="mt-auto d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/tasks/{id}/edit(id=${item.taskId})}">編集</a><form th:action="@{/tasks/{id}/delete(id=${item.taskId})}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit">削除</button></form></div>
    </div></div></div>
  </div>
</main>
</body>
</html>
