<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('タスク詳細')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container page-container py-4"><div class="row justify-content-center"><div class="col-12 col-lg-8">
  <div class="page-header d-flex justify-content-between align-items-start gap-3"><div><h1 class="h2 mb-1">タスク詳細</h1><p class="text-muted mb-0">タスクの内容を確認できます。</p></div><a class="btn btn-primary" th:href="@{/tasks/{id}/edit(id=${task.taskId})}">編集</a></div>
  <div class="card border-0 shadow-sm"><div class="card-body p-4"><h2 class="h3 mb-4" th:text="${task.title}"></h2><dl class="row mb-0"><dt class="col-sm-3 text-muted">ステータス</dt><dd class="col-sm-9"><span class="badge bg-secondary" th:text="${task.status}"></span></dd><dt class="col-sm-3 text-muted">優先度</dt><dd class="col-sm-9" th:text="${task.priority}"></dd><dt class="col-sm-3 text-muted">期限</dt><dd class="col-sm-9" th:text="${task.dueDate != null ? task.dueDate : '-'}"></dd><dt class="col-sm-3 text-muted">詳細</dt><dd class="col-sm-9 text-break" th:text="${task.description != null ? task.description : '-'}"></dd><dt class="col-sm-3 text-muted">タグ</dt><dd class="col-sm-9"><span class="badge rounded-pill bg-info text-dark tag-badge" th:each="tagName : ${tagNames}" th:text="${tagName}"></span><span th:if="${#lists.isEmpty(tagNames)}" class="text-muted">タグなし</span></dd></dl></div></div>
  <div class="mt-3 d-flex gap-2"><form th:action="@{/tasks/{id}/delete(id=${task.taskId})}" method="post"><button class="btn btn-outline-danger" type="submit">削除</button></form><a class="btn btn-outline-secondary" th:href="@{/tasks}">一覧へ戻る</a></div>
</div></div></main>
</body>
</html>
