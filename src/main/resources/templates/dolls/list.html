<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle} + ' | dolly closet'">ドール一覧</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="page-shell">
	<div th:replace="~{fragments :: messages}"></div>
	<section class="section-heading page-heading"><div><p class="eyebrow">MY DOLLS</p><h1>ドール一覧</h1><p class="muted">プロフィールを開いて、うちの子のことを確認できます。</p></div><a class="button button-primary" th:href="@{/dolls/new}">＋ ドールをお迎え</a></section>
	<div class="card-grid" th:if="${!#lists.isEmpty(dolls)}">
		<a class="doll-card" th:each="doll : ${dolls}" th:href="@{/dolls/{id}(id=${doll.id})}">
			<div class="doll-card-body"><p class="eyebrow">DOLL PROFILE</p><h3 th:text="${doll.name}">名前</h3><p class="muted" th:text="${doll.maker != null ? doll.maker : 'メーカー未登録'}">メーカー</p><div class="tag-row"><span class="tag" th:if="${doll.bodyName}" th:text="${doll.bodyName}"></span><span class="tag" th:if="${doll.bodySize}" th:text="${doll.bodySize}"></span></div><span class="card-arrow">詳細を見る <b>→</b></span></div>
		</a>
	</div>
	<div class="empty-state" th:if="${#lists.isEmpty(dolls)}"><h2>ドールはまだ登録されていません</h2><a class="button button-primary" th:href="@{/dolls/new}">ドールを登録</a></div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
