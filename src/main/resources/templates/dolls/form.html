<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${formTitle} + ' | dolly closet'">ドール登録</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="page-shell form-shell">
	<a class="back-link" th:href="${dollId != null ? '/dolls/' + dollId : '/'}">← 戻る</a>
	<section class="form-intro"><p class="eyebrow">DOLL PROFILE</p><h1 th:text="${formTitle}">ドールをお迎え</h1><p>わかる範囲でプロフィールを記録しましょう。</p></section>
	<form class="content-panel form-panel" th:object="${dollForm}" th:action="${dollId != null ? '/dolls/' + dollId : '/dolls'}" method="post">
		<div class="form-field"><label for="name">ドール名 <span class="required">必須</span></label><input id="name" type="text" th:field="*{name}" maxlength="100" required><p class="field-error" th:errors="*{name}"></p></div>
		<div class="form-grid"><div class="form-field"><label for="maker">メーカー</label><input id="maker" type="text" th:field="*{maker}" maxlength="100"></div><div class="form-field"><label for="bodyName">ボディ名</label><input id="bodyName" type="text" th:field="*{bodyName}" maxlength="100"></div><div class="form-field"><label for="bodySize">ボディサイズ</label><input id="bodySize" type="text" th:field="*{bodySize}" maxlength="50"></div><div class="form-field"><label for="wigSize">ウィッグサイズ</label><input id="wigSize" type="text" th:field="*{wigSize}" maxlength="50"></div><div class="form-field"><label for="eyeSize">アイサイズ</label><input id="eyeSize" type="text" th:field="*{eyeSize}" maxlength="50"></div></div>
		<div class="form-field"><label for="notes">備考</label><textarea id="notes" th:field="*{notes}" rows="5"></textarea></div>
		<div class="form-actions"><a class="button button-quiet" th:href="${dollId != null ? '/dolls/' + dollId : '/'}">キャンセル</a><button class="button button-primary" type="submit">保存する</button></div>
	</form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
