<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${doll.name} + ' | dolly closet'">プロフィール</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="page-shell">
	<div th:replace="~{fragments :: messages}"></div>
	<a class="back-link" th:href="@{/}">← ドール一覧へ</a>
	<section class="profile-hero"><div class="profile-title"><p class="eyebrow">DOLL PROFILE</p><h1 th:text="${doll.name}">名前</h1><p class="muted" th:text="${doll.maker != null ? doll.maker : 'メーカー未登録'}">メーカー</p></div><div class="button-row"><a class="button button-secondary" th:href="@{/dolls/{id}/edit(id=${doll.id})}">プロフィールを編集</a><form th:action="@{/dolls/{id}/delete(id=${doll.id})}" method="post" onsubmit="return confirm('このドールを削除しますか？この子とのお洋服の紐付けも削除されます。')"><button class="button button-danger-outline" type="submit">削除</button></form></div></section>
	<section class="content-panel"><div class="section-heading"><div><p class="eyebrow">ABOUT</p><h2>プロフィール</h2></div></div><dl class="detail-grid"><div><dt>メーカー</dt><dd th:text="${doll.maker ?: '未登録'}"></dd></div><div><dt>ボディ名</dt><dd th:text="${doll.bodyName ?: '未登録'}"></dd></div><div><dt>ボディサイズ</dt><dd th:text="${doll.bodySize ?: '未登録'}"></dd></div><div><dt>ウィッグサイズ</dt><dd th:text="${doll.wigSize ?: '未登録'}"></dd></div><div><dt>アイサイズ</dt><dd th:text="${doll.eyeSize ?: '未登録'}"></dd></div><div class="detail-wide"><dt>備考</dt><dd class="preserve-lines" th:text="${doll.notes ?: '備考はありません。'}"></dd></div></dl></section>
	<section class="section-heading"><div><p class="eyebrow">WARDROBE</p><h2>この子のお洋服</h2></div><a class="button button-secondary" th:href="@{/clothes/new}">＋ 所持アイテムを追加</a></section>
	<div class="table-wrap" th:if="${!#lists.isEmpty(clothes)}"><table><thead><tr><th>商品デザイン</th><th>カラー</th><th>ブランド</th><th>カテゴリ</th><th>サイズ</th><th>セット名</th></tr></thead><tbody><tr th:each="item : ${clothes}"><td><a class="table-link" th:href="@{/clothes/{id}(id=${item.id})}" th:text="${item.name}"></a></td><td><span class="variation-cell"><span class="color-swatch" th:style="|background-color: ${item.colorHex ?: '#F3F5F4'}|" aria-hidden="true"></span><span th:text="${item.colorName ?: 'カラー未登録'}"></span></span></td><td th:text="${item.brandName}"></td><td th:text="${item.categoryName}"></td><td th:text="${item.size ?: '—'}"></td><td th:text="${item.setName ?: '単品'}"></td></tr></tbody></table></div>
	<div class="empty-inline" th:if="${#lists.isEmpty(clothes)}"><p>この子に紐付いたお洋服はまだありません。</p><a class="text-link" th:href="@{/clothes}">お洋服一覧を見る →</a></div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
