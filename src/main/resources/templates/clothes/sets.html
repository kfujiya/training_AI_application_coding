<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle} + ' | dolly closet'">セット一覧</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="page-shell"><section class="section-heading page-heading"><div><p class="eyebrow">COORDINATED SETS</p><h1>フルセット一覧</h1><p class="muted">ブランドとセット名ごとに、お洋服をまとめて確認できます。</p></div></section>
	<div class="set-grid" th:if="${!#lists.isEmpty(sets)}"><a class="set-card" th:each="set : ${sets}" th:href="@{/sets/{brandId}(brandId=${set.brandId},name=${set.name})}"><span class="eyebrow" th:text="${set.brandName}">ブランド</span><h2 th:text="${set.name}">セット名</h2><span class="muted" th:text="${set.itemCount} + ' アイテム'">0アイテム</span><span class="card-arrow">セットを見る <b>→</b></span></a></div>
	<div class="empty-state" th:if="${#lists.isEmpty(sets)}"><h2>セット名が登録されたお洋服はありません</h2><p>お洋服の登録時にセット名を設定すると、ここにまとまります。</p><a class="button button-secondary" th:href="@{/clothes}">お洋服一覧へ</a></div>
</main><footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
