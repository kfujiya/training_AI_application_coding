<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${design.name} + ' | dolly closet'">商品デザイン</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="page-shell">
	<div th:replace="~{fragments :: messages}"></div><a class="back-link" th:href="@{/designs}">← 商品デザイン一覧へ</a>
	<section class="profile-hero"><div class="profile-title"><p class="eyebrow" th:text="${design.brandName}">ブランド</p><h1 th:text="${design.name}">商品名</h1><div class="tag-row"><span class="tag" th:text="${design.categoryName}">カテゴリ</span><a class="tag tag-link" th:if="${design.setName}" th:href="@{/sets/{brandId}(brandId=${design.brandId},name=${design.setName})}" th:text="${design.setName}">セット</a></div></div><div class="button-row"><a class="button button-primary" th:href="@{/clothes/new(designId=${design.id})}">＋ 色違いを追加</a><a class="button button-secondary" th:href="@{/designs/{id}/edit(id=${design.id})}">デザインを編集</a><form th:action="@{/designs/{id}/delete(id=${design.id})}" method="post" onsubmit="return confirm('この商品デザインを削除しますか？')"><button class="button button-danger-outline" type="submit">削除</button></form></div></section>
	<section class="content-panel"><p class="eyebrow">DESIGN DETAILS</p><h2>共通情報</h2><dl class="detail-grid"><div><dt>ブランド・購入元</dt><dd th:text="${design.brandName}"></dd></div><div><dt>カテゴリ</dt><dd th:text="${design.categoryName}"></dd></div><div><dt>セット名</dt><dd><span th:text="${design.setName ?: '単品'}"></span><a class="text-link inline-link" th:if="${design.setName}" th:href="@{/sets/{brandId}(brandId=${design.brandId},name=${design.setName})}">同じセットを見る →</a></dd></div><div class="detail-wide"><dt>商品説明・共通メモ</dt><dd class="preserve-lines" th:text="${design.description ?: '共通メモはありません。'}"></dd></div></dl></section>
	<section class="section-heading owned-heading"><div><p class="eyebrow">OWNED VARIATIONS</p><h2>所持アイテム <span class="count-note" th:text="${#lists.size(ownedItems)}"></span></h2></div><a class="button button-secondary" th:href="@{/clothes/new(designId=${design.id})}">＋ 色違いを追加</a></section>
	<div class="table-wrap" th:if="${!#lists.isEmpty(ownedItems)}"><table><thead><tr><th>カラー</th><th>メーカー表記サイズ</th><th>着用可能なドール</th><th>個別メモ</th><th></th></tr></thead><tbody><tr th:each="item : ${ownedItems}"><td><a class="variation-cell" th:href="@{/clothes/{id}(id=${item.id})}"><span class="color-swatch" th:style="|background-color: ${item.colorHex ?: '#F3F5F4'}|" aria-hidden="true"></span><span th:text="${item.colorName ?: 'カラー未登録'}"></span><code th:if="${item.colorHex}" th:text="${item.colorHex}"></code></a></td><td th:text="${item.size ?: '—'}"></td><td><span th:if="${!#lists.isEmpty(item.dolls)}" th:each="doll, stat : ${item.dolls}" th:text="${(stat.index > 0 ? '、' : '') + doll.name}"></span><span class="muted" th:if="${#lists.isEmpty(item.dolls)}">未設定</span></td><td class="preserve-lines" th:text="${item.notes ?: '—'}"></td><td><a class="table-link" th:href="@{/clothes/{id}(id=${item.id})}">詳細</a></td></tr></tbody></table></div>
	<div class="empty-inline" th:if="${#lists.isEmpty(ownedItems)}"><p>このデザインの所持アイテムはまだありません。</p><a class="text-link" th:href="@{/clothes/new(designId=${design.id})}">最初の色を追加 →</a></div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
