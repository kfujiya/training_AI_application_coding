<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${setName} + ' | dolly closet'">セット</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header th:replace="~{fragments :: header}"></header><main class="page-shell"><a class="back-link" th:href="@{/sets}">← セット一覧へ</a><section class="page-heading"><p class="eyebrow">COORDINATED SET</p><h1 th:text="${setName}">セット名</h1></section>
	<div class="clothes-grid" th:if="${!#lists.isEmpty(clothes)}"><article class="clothing-card" th:each="item : ${clothes}"><div class="clothing-card-body"><p class="eyebrow" th:text="${item.brandName}"></p><h2><a th:href="@{/clothes/{id}(id=${item.id})}" th:text="${item.name}"></a></h2><div class="swatch-line"><span class="color-swatch" th:style="|background-color: ${item.colorHex ?: '#F3F5F4'}|" aria-hidden="true"></span><span th:text="${item.colorName ?: 'カラー未登録'}"></span></div><div class="tag-row"><span class="tag" th:text="${item.categoryName}"></span><span class="tag" th:if="${item.size}" th:text="${item.size}"></span></div><span class="card-arrow">詳細を見る <b>→</b></span></div></article></div>
	<div class="empty-state" th:if="${#lists.isEmpty(clothes)}"><h2>このセットのお洋服はありません</h2></div>
</main><footer th:replace="~{fragments :: footer}"></footer></body>
</html>
