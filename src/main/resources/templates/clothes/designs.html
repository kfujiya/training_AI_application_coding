<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle} + ' | dolly closet'">商品デザイン</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="page-shell">
	<div th:replace="~{fragments :: messages}"></div>
	<section class="section-heading page-heading"><div><p class="eyebrow">DESIGN ARCHIVE</p><h1>商品デザイン</h1><p class="muted">ブランドやカテゴリなどの共通情報をまとめ、色違いの所持品を管理します。</p></div><a class="button button-primary" th:href="@{/designs/new}">＋ デザインを登録</a></section>
	<p class="result-caption" th:text="${#lists.size(designs)} + ' 件の商品デザイン'">0件の商品デザイン</p>
	<div class="design-grid" th:if="${!#lists.isEmpty(designs)}">
		<article class="design-card" th:each="design : ${designs}">
			<div><p class="eyebrow" th:text="${design.brandName}">ブランド</p><h2><a th:href="@{/designs/{id}(id=${design.id})}" th:text="${design.name}">商品名</a></h2><div class="tag-row"><span class="tag" th:text="${design.categoryName}">カテゴリ</span><span class="tag tag-soft" th:if="${design.setName}" th:text="${design.setName}">セット</span></div></div>
			<a class="design-variants" th:href="@{/designs/{id}(id=${design.id})}"><span th:text="${design.ownedItemCount} + ' 点の所持アイテム'">0点</span><b>→</b></a>
		</article>
	</div>
	<div class="empty-state" th:if="${#lists.isEmpty(designs)}"><h2>商品デザインはまだありません</h2><p>商品名やブランド、カテゴリを登録してから、色違いの所持アイテムを追加できます。</p><a class="button button-secondary" th:href="@{/designs/new}">商品デザインを登録</a></div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
