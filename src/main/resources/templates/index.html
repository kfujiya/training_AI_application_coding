<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>幻晶ガチャ</title><link rel="stylesheet" th:href="@{/css/gacha.css}"></head>
<body><main><p class="brand">Fantasy Relics · Item Draw</p><h1>幻晶ガチャ</h1><p class="intro">運命を引き寄せて、あなただけの装備を手に入れよう。</p>
<section class="panel draw-panel"><div><h2>1回召喚</h2><p>SSR / SR / R のアイテムが登場します</p></div><form method="post" action="/draw"><button class="draw-button" type="submit">✦ ガチャを引く</button></form></section>
<section class="panel result" th:if="${result}"><div class="result-head"><span class="result-label">Draw result</span><span class="rarity" th:classappend="${'rarity-' + #strings.toLowerCase(result.raritySnapshot)}" th:text="${result.raritySnapshot}"></span></div><div class="result-content"><img class="item-art" th:if="${result.itemNameSnapshot == 'SSRレジェンドソード'}" th:src="@{/images/ssr-legend-sword.svg}" alt="SSRレジェンドソード"><img class="item-art" th:if="${result.itemNameSnapshot == 'SRミラクルシールド'}" th:src="@{/images/sr-miracle-shield.svg}" alt="SRミラクルシールド"><img class="item-art" th:if="${result.itemNameSnapshot == 'Rブロンズソード'}" th:src="@{/images/r-bronze-sword.svg}" alt="Rブロンズソード"><div><p class="result-label">獲得アイテム</p><p class="item-name" th:text="${result.itemNameSnapshot}"></p></div></div></section>
<section class="panel result" th:if="${latestHistory != null and result == null}"><div class="result-head"><span class="result-label">Latest result</span><span class="rarity" th:classappend="${'rarity-' + #strings.toLowerCase(latestHistory.raritySnapshot)}" th:text="${latestHistory.raritySnapshot}"></span></div><div class="result-content"><img class="item-art" th:if="${latestHistory.itemNameSnapshot == 'SSRレジェンドソード'}" th:src="@{/images/ssr-legend-sword.svg}" alt="SSRレジェンドソード"><img class="item-art" th:if="${latestHistory.itemNameSnapshot == 'SRミラクルシールド'}" th:src="@{/images/sr-miracle-shield.svg}" alt="SRミラクルシールド"><img class="item-art" th:if="${latestHistory.itemNameSnapshot == 'Rブロンズソード'}" th:src="@{/images/r-bronze-sword.svg}" alt="Rブロンズソード"><div><p class="result-label">直近の抽選結果</p><p class="item-name" th:text="${latestHistory.itemNameSnapshot}"></p></div></div></section>
<p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p><div class="links"><a href="/history">抽選履歴を見る →</a></div></main></body></html>
