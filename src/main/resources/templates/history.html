<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>抽選履歴 - 幻晶ガチャ</title><link rel="stylesheet" th:href="@{/css/gacha.css}"></head>
<body><main><p class="brand">Fantasy Relics · Archive</p><h1>抽選履歴</h1><p class="intro"><a href="/">← ガチャ画面に戻る</a></p><p class="panel empty" th:if="${#lists.isEmpty(histories)}">抽選履歴はありません。</p><div class="panel history-panel" th:if="${!#lists.isEmpty(histories)}"><table><thead><tr><th>抽選日時</th><th>アイテム名</th><th>レアリティ</th></tr></thead><tbody><tr th:each="history : ${histories}"><td th:text="${history.drawnAt}"></td><td><div class="history-item"><img class="history-art" th:if="${history.itemNameSnapshot == 'SSRレジェンドソード'}" th:src="@{/images/ssr-legend-sword.svg}" alt="SSRレジェンドソード"><img class="history-art" th:if="${history.itemNameSnapshot == 'SRミラクルシールド'}" th:src="@{/images/sr-miracle-shield.svg}" alt="SRミラクルシールド"><img class="history-art" th:if="${history.itemNameSnapshot == 'Rブロンズソード'}" th:src="@{/images/r-bronze-sword.svg}" alt="Rブロンズソード"><span th:text="${history.itemNameSnapshot}"></span></div></td><td><span class="rarity" th:classappend="${'rarity-' + #strings.toLowerCase(history.raritySnapshot)}" th:text="${history.raritySnapshot}"></span></td></tr></tbody></table></div></main></body></html>
