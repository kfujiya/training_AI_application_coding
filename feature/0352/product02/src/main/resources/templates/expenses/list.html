<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>支出一覧 - 簡易家計簿アプリ</title>
    <style>
        body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #263238; }
        h1 { margin-bottom: 1.5rem; }
        .actions { margin: 1rem 0; }
        .button { display: inline-block; padding: .65rem 1rem; background: #1f4e78; color: #fff; border-radius: 4px; text-decoration: none; }
        .summary { margin: 1rem 0; padding: 1rem; background: #eef5fb; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: .75rem; border-bottom: 1px solid #d9e0e5; text-align: left; }
        th { background: #f4f6f8; }
        .amount { text-align: right; white-space: nowrap; }
        .edit-link { color: #1f4e78; }
        .delete-button { padding: .35rem .6rem; border: 0; border-radius: 4px; background: #b71c1c; color: #fff; font: inherit; cursor: pointer; }
        .row-actions { display: flex; align-items: center; gap: .75rem; }
        .empty { padding: 2rem; text-align: center; color: #607d8b; }
    </style>
</head>
<body>
<main>
    <h1>簡易家計簿アプリ</h1>
    <p class="actions"><a class="button" th:href="@{/expenses/new}">支出を登録</a></p>

    <section class="summary" aria-label="支出合計">
        支出合計：<strong th:text="|¥${#numbers.formatDecimal(totalAmount, 1, 'COMMA', 0, 'POINT')}|">¥0</strong>
    </section>

    <table th:if="${!#lists.isEmpty(expenses)}">
        <thead>
        <tr>
            <th scope="col">支出日</th>
            <th scope="col">カテゴリ</th>
            <th scope="col">内容</th>
            <th scope="col" class="amount">金額</th>
            <th scope="col">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="expense : ${expenses}">
            <td th:text="${expense.expenseDate}">2026-01-01</td>
            <td th:text="${expense.category}">食費</td>
            <td th:text="${expense.description}">昼食</td>
            <td class="amount" th:text="|¥${#numbers.formatDecimal(expense.amount, 1, 'COMMA', 0, 'POINT')}|">¥500</td>
            <td>
                <div class="row-actions">
                    <a class="edit-link" th:href="@{/expenses/{id}/edit(id=${expense.id})}">編集</a>
                    <form th:action="@{/expenses/{id}/delete(id=${expense.id})}" method="post"
                          onsubmit="return confirm('この支出を削除します。よろしいですか？');">
                        <button class="delete-button" type="submit">削除</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="empty" th:if="${#lists.isEmpty(expenses)}">支出データはまだ登録されていません。</p>
</main>
</body>
</html>
